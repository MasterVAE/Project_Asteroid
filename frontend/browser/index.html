<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080e19">
  <title>Asteroid — карта мира</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="map" aria-label="Карта астероидов и кораблей. Перетаскивайте карту и используйте колесо для масштаба." tabindex="0"></canvas>
  <header class="panel">
    <div class="heading"><strong>ASTEROID <span>/ карта мира</span></strong><span id="status" role="status">Нет подключения</span></div>
    <form id="connection">
      <label class="sr-only" for="username">Логин</label>
      <input id="username" name="username" placeholder="Логин" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_-]+" autocomplete="username" spellcheck="false">
      <label class="sr-only" for="password">Пароль</label>
      <input id="password" name="password" type="password" placeholder="Пароль (от 12 символов)" required minlength="12" maxlength="1024" autocomplete="current-password">
      <button id="connect" type="submit">Войти</button>
      <button id="register-mode" type="button">Создать аккаунт</button>
    </form>
    <div id="account" hidden>
      <span id="account-name"></span>
      <button id="keys-open" type="button">API-ключи</button>
      <button id="disconnect" type="button">Выйти</button>
    </div>
    <p id="message" role="status">Проверка входа…</p>
  </header>
  <section id="keys" class="panel" hidden aria-labelledby="keys-title">
    <div class="heading"><h2 id="keys-title">API-ключи</h2><button id="keys-close" type="button">Закрыть</button></div>
    <p>Отдельные ключи для Python и других клиентов. Выход из сайта не останавливает их работу.</p>
    <form id="key-form">
      <label for="key-name">Название</label>
      <input id="key-name" placeholder="Мой Python-бот" required maxlength="80">
      <label for="key-days">Срок действия, дней</label>
      <input id="key-days" type="number" value="30" min="1" max="365" required>
      <label for="key-password">Подтвердите пароль</label>
      <input id="key-password" type="password" autocomplete="current-password" required maxlength="1024">
      <button id="key-create" type="submit">Создать ключ</button>
    </form>
    <p id="key-message" role="status"></p>
    <div id="key-result" hidden>
      <label for="key-secret">Скопируйте ключ сейчас: повторно он не показывается.</label>
      <textarea id="key-secret" readonly rows="3" spellcheck="false"></textarea>
    </div>
    <div id="key-list"></div>
  </section>
  <aside id="selection" class="panel" hidden aria-live="polite"></aside>
  <div class="toolbar panel" aria-label="Управление картой">
    <button id="zoom-in" type="button" aria-label="Увеличить">+</button>
    <button id="zoom-out" type="button" aria-label="Уменьшить">−</button>
    <button id="fit" type="button">Вся карта</button>
    <button id="fullscreen" type="button">Полный экран</button>
  </div>
  <footer class="panel"><span><i class="asteroid"></i>Астероиды: <b id="asteroid-count">0</b></span><span><i class="craft"></i>Корабли: <b id="craft-count">0</b></span><span id="scale">100%</span><span class="hint">Тянуть — перемещение · Колесо / + − — масштаб · F — вся карта</span></footer>
  <script type="module" src="app.js"></script>
</body>
</html>
